# ════════════════════════════════════════════════════════════════════════
#  本校 羽毛球场自动抢场 —— 配置模板
#
#  用法：复制本文件为 config.yaml，填好 auth.token 与 auth.usercode 后即可。
#    cp config.example.yaml config.yaml
#       （Windows: copy config.example.yaml config.yaml）
#
#  注意：config.yaml 含登录凭证，不要提交到任何仓库、不要外发。
# ════════════════════════════════════════════════════════════════════════

# ── 服务端地址（一般不用改）──────────────────────────────────────────────
baseUrl: https://<你的学校平台域名>
prefix: /service/appointment/appointment

# ── 场馆 ────────────────────────────────────────────────────────────────
venue:
  # 羽毛球（来自你提供的入口链接 item 参数）
  nodeid: "<场馆nodeid>"
  name: 羽毛球

# ── 登录凭证 ────────────────────────────────────────────────────────────
auth:
  # 你的学工号：既用于下单（reservationPerson），也是自动换发 token 的凭据
  usercode: ""

  # ★ 自动续期开关 —— 打开后**不需要再手动抓包喂 token**
  #   true  = 启动时 / 长时间待命期间，脚本会用学号调 POST /phone/login/idSerialLogin
  #           换发新 token 并写回本文件（token 寿命只有 38~80 分钟，所以必须能自动续）
  #   false = 只验证不换发；token 失效时脚本直接退出并提示
  #
  # ⚠️ 该接口对学号不做任何二次校验（无密码、无验证码）—— 学号在本校是半公开信息，
  #    因此理论上知道任何人的学号都能换发出他的 token。这是**学校平台的鉴权缺陷**。
  #    本项目只允许用于你自己的账号；请只填自己的学号，绝不要换发他人账号的 token。
  allowRenew: true

  # token 剩余寿命低于多少分钟时自动换发
  renewBeforeMin: 10

  # 当前 token。留空也行 —— 开启 allowRenew 后脚本会自己换一个填进来。
  # 手动换发：node src/login.js --renew
  token: ""

# ── 抢场目标 ────────────────────────────────────────────────────────────
target:
  # 目标日期。留空 "" = 每周自动抢「服务端当前能订的最后一天」（T+2，每天 08:00 放出）。
  # 写死日期时记得去掉 cron 里的 --rel：优先级是 --date > --rel > 本项 > 窗口最后一天。
  date: ""

  # 时段优先级：数组顺序 = 优先级，可写多个备选
  #   写成 ["18:00","20:00"] 表示要 2 小时整段；系统按小时放场，会自动拼接
  #   例如目标 19:00-21:00，若只有 19:00-20:00 与 20:00-21:00，会自动拼成一段
  #
  # ★ 本项目的实测排法：17-19 第一 → 16-18 第二 → 18-20 第三。
  #   原因是 本校 体育馆 18:00 以后常被「体育部教学」固定占用（网格里显示
  #   haveLimit），16:00-18:00 反而更容易抢到。改成你自己学校的时段即可。
  hourPriority:
    - ["17:00", "19:00"]
    - ["16:00", "18:00"]
    - ["18:00", "20:00"]

  # 场地优先级：数组顺序 = 优先级；留空 [] 表示「场地不限，有就行」
  # 场地 nodeid 可从 logs 里的「场地清单已加载」行抄下来，或用 `node src/probe.js courts` 查看
  courtPriority: []

  # true = 同一**张单**里的多个时段必须落在同一片场地。
  #   ★ 2026-10-12 起口径是「一张单里连着 2 小时、同一片场地」，
  #   所以这项必须是 true（两个时段落在同一片场地上）。
  #   为什么不再用「两片场地各 1 小时」：平台服务端直接拒绝，
  #   原文「每人每天最多可预定1次」+「每天最多选择预约1个不同场地」。
  sameCourt: true
  # ★ 课表冲突容忍度（分钟）：显式偏好时段与上课时间重叠超过这个值就整条降级到末尾。
  #   0 = 一点都不能重叠；30 = 允许蹭到课前半小时（默认）。
  conflictGraceMin: 30
  # ★ 课表避让：下面两份都只是**示例**，请按自己的课表改；enabled: false 可整体关掉避让。
  schedule:
    classes:
      # 每周固定要上的课。开源版只留两条示例。
      mon:
        - ["08:00", "09:40"]   # 示例：星期一 1-2 节
      tue:
        - ["10:00", "11:40"]   # 示例：星期二 3-4 节
    # 二次覆盖：把下列区间从「有课」里挖掉（不想去的那节课）。留空 {} 也行。
    free:
      wed: [["18:30", "21:05"]]   # 示例：星期三晚上的课不去
  # ★ 课表避让：按星期几写「有课」的时间区间，抢场时自动绕开。
  #   为什么要避让：订场时间最好别和上课撞车（个别不想去的课可以用 free 挖掉）。
  #
  #   ⚠️ 教务系统一般**只有节次、没有钟点**，所以得自己核对一份「节次 → 钟点」表。
  #      下面这种口径很多学校通用，仅供参考（不保证适用于你）：
  #       一、二节 08:00-09:40   三、四节 10:10-11:50   五、六节 14:00-15:40
  #       九、十节 18:30-20:05  十一、十二节 20:15-21:50
  #   改的时候直接改时间字符串即可；enabled: false 可整体关掉避让。
# ── 调度 ────────────────────────────────────────────────────────────────
schedule:
  # 触发时刻优先用服务端下发的 nextReleaseAt；
  # 只有在它为空时才用下面这个兜底时间
  fallbackTriggerTime: "08:00:00"

  # 提前多少毫秒开始冲刺（覆盖网络抖动）
  leadMs: 1200

  # 放场前「慢速候场」复查间隔（毫秒）。放场前只按这个节奏拉网格，
  # 避免为了盯 08:00 而在 07:5x 就把服务器打满
  idlePollMs: 15000

  # 收尾窗口：离放场时刻不足这个毫秒数时，复查节奏从 idlePollMs 收紧到 finalPollMs。
  # 2026-10-25 实测：固定 15 秒一次 → 08:00:00 开闸后要 17.7 秒才看见窗口已开，
  # 晚 17 秒冲刺（冷门时段没事，秒没的时段等于必输）
  finalPollWindowMs: 60000

  # 收尾窗口内的复查间隔（毫秒）
  finalPollMs: 500

  # 放场时刻之后的宽限期（毫秒）。服务端放场有时晚十几秒到一两分钟；
  # 超过宽限期目标日期还没放出来就放弃本轮（绝不抢其它日期）
  guardGraceMs: 180000

  # 距离放场还很久时的状态复查间隔（毫秒）
  warmupPollMs: 20000

  # 冲刺轮询间隔（毫秒）。120ms ≈ 每秒 8 次，已相当激进；
  # 不建议低于 100ms —— 会被风控盯上，也会给学校服务器添麻烦
  burstPollMs: 120

  # 冲刺最长持续（毫秒）。90 秒足够：08:00:00 那一瞬间场地就出来了
  burstDurationMs: 90000

  # 抢到一段就停（学校规则：每天只能订 2 小时）
  stopOnFirstHit: true

# ── 网络 ────────────────────────────────────────────────────────────────
net:
  timeoutMs: 20000
  # 相邻请求最小间隔（毫秒）
  minIntervalMs: 120
  # 单次运行最多尝试多少种「方案 × 场地」组合下单
  maxReservationAttempts: 6
  retriesOnNetworkError: 2

# ── 安全阀（强烈建议保持默认）──────────────────────────────────────────
safety:
  # 硬熔断：整个进程最多发多少次下单请求
  maxReservationPostsPerRun: 8
  # 同日最多持有订单数
  #   ★ 1 = 平台硬规则「每人每天最多可预定1次」；多要一张只会被服务端拒绝。
  #   2 小时装在同一张单里（target.maxSlots = 2）。
  maxOrdersPerDay: 1
  # true = 全流程演练但绝不真正下单
  dryRun: false

# ── 支付 ────────────────────────────────────────────────────────────────
pay:
  # semi = 脚本只负责「抢到并锁场」，然后推送提醒，你在微信里付款  ← 推荐
  # auto = 自动挑一条「服务端能跑完」的通道直接扣款（78 优先，其次 77）
  # skip = 只下单，不推送
  mode: semi

  # 2026-10-10 实测 本校 该账号 getPaywayList 只有两条：
  #   50 = bjyyPay              统一支付平台 → 只返回 payurl，必须人工在浏览器里付（服务端跑不完）
  #   77 = openPlatFormPayOrder 一卡通支付   → ★ 服务端直接扣款，无跳转、无二维码、无密码
  #   78 = accountPayOrder      账户卡余额   → 该账号未开通
  # auto 模式下留空即可：脚本按 78 → 77 自动挑可用通道；填了也仍会校验它到底可不可用。
  payway: ""

  # accno（校园卡账号 / 一卡通号）：78 通道才用，且优先取服务端返回的 banknum。
  # 留空即可 —— 想提前看清通道与账号，运行：
  #     node src/probe.js pay
  # ⚠️ cardPassword 填写后本文件即等价于支付凭证文件，请妥善保管、别提交仓库；不确定就先别填，用 semi。
  accno: ""
  cardPassword: ""

  # 演练开关：auto 模式下也只走到「校验通道 + 拿到 accno + 卡价」就停，不提交支付
  dryRunPay: false

  # 抢到后把付款提示推给你
  notify:
    console: true
    # 可选：企业微信机器人 / 钉钉 / 飞书 / Bark / Server 酱 的 webhook 地址
    webhookUrl: ""

paths:
  logs: logs
  state: data
